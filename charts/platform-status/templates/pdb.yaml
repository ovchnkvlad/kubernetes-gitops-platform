apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "platform-status.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-status.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "platform-status.selectorLabels" . | nindent 6 }}

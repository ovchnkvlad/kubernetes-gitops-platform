apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform-status.name" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-status.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform-status.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress: []

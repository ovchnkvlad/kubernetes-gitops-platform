replicaCount: 2

image:
  repository: ghcr.io/nginx/nginx-unprivileged
  tag: "1.31.7-alpine3.24"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

podDisruptionBudget:
  minAvailable: 1

networkPolicy:
  ingressNamespaces:
    - ingress-nginx
    - observability

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-status
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads
  source:
    repoURL: https://example.invalid/kubernetes-gitops-platform.git
    targetRevision: main
    path: charts/platform-status
    helm:
      releaseName: platform-status
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
